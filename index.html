<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David Baez</title>
<meta name="description" content="David Baez — iOS developer in South Florida.">
<style>
  :root {
    --paper: #F4F5F2;
    --ink: #23302B;
    --ink-soft: #66756D;
    --accent: #2E6E8E;
    --line: #DFE3DF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 18px/1.7 Georgia, 'Times New Roman', serif;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 48px 24px;
  }
  main { max-width: 480px; width: 100%; }
  h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .role {
    color: var(--ink-soft);
    font-style: italic;
    margin-top: 4px;
  }
  nav {
    margin-top: 40px;
    border-top: 1px solid var(--line);
  }
  nav a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 18px 2px;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  nav a .label {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600;
    font-size: 16px;
  }
  nav a .note {
    color: var(--ink-soft);
    font-size: 15px;
    text-align: right;
  }
  nav a:hover .label { color: var(--accent); }
  nav a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  footer {
    margin-top: 44px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<main>
  <h1>David Baez</h1>
  <p class="role">iOS developer in South Florida</p>

  <nav>
    <a href="/charadesgo/">
      <span class="label">Charades GO</span>
      <span class="note">a party game for iPhone</span>
    </a>
    <a href="mailto:redcouchmail@gmail.com">
      <span class="label">Email</span>
      <span class="note">say hello</span>
    </a>
    <a href="https://paypal.me/DavidBaez">
      <span class="label">Tip jar</span>
      <span class="note">if you're feeling kind</span>
    </a>
  </nav>

  <footer>&copy; 2026 David Baez</footer>
</main>
</body>
</html>
